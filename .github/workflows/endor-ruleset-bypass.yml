name: Endor Ruleset Bypass

on:
  issues:
    types: [opened]

jobs:
  bypass:
    if: startsWith(github.event.issue.title, 'Bypass ruleset:')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      administration: write
      contents: read

    steps:
      - name: Parse issue title
        id: parse
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          # Expected: "Bypass ruleset: PR #5 for 3m"
          if [[ "$TITLE" =~ Bypass\ ruleset:\ PR\ \#([0-9]+)\ for\ ([0-9]+)m$ ]]; then
            echo "pr_number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "minutes=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "error=Could not parse title. Expected: 'Bypass ruleset: PR #<number> for <minutes>m'" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject malformed request
        if: steps.parse.outputs.error
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          MSG: ${{ steps.parse.outputs.error }}
        run: |
          gh issue comment "$ISSUE" --repo ${{ github.repository }} --body ":x: $MSG"
          gh issue close "$ISSUE" --repo ${{ github.repository }}
          exit 1

      - name: Look up the ruleset
        id: ruleset
        if: steps.parse.outputs.pr_number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api repos/${{ github.repository }}/rulesets --jq '.[] | select(.name=="require-endor-scan") | .id')
          if [ -z "$id" ]; then
            echo "Ruleset 'require-endor-scan' not found" >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Disable the ruleset
        id: disable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RULESET_ID: ${{ steps.ruleset.outputs.id }}
          MINUTES: ${{ steps.parse.outputs.minutes }}
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api repos/${{ github.repository }}/rulesets/$RULESET_ID \
            -X PUT -f enforcement=disabled > /dev/null

          expiry=$(date -u -d "+${MINUTES} minutes" +"%Y-%m-%d %H:%M:%S UTC")
          echo "expiry=$expiry" >> "$GITHUB_OUTPUT"

          gh issue comment "$ISSUE" --repo ${{ github.repository }} --body ":unlock: Ruleset \`require-endor-scan\` disabled for PR #$PR_NUMBER.

          - Requested by: @${{ github.event.issue.user.login }}
          - Window: ${MINUTES} minute(s)
          - Auto re-enable at: ${expiry}
          - The underlying Endor finding(s) are **not** dismissed. They remain open and will block the next PR normally.

          You can merge PR #$PR_NUMBER now."

      - name: Wait for the bypass window
        env:
          MINUTES: ${{ steps.parse.outputs.minutes }}
        run: sleep $(( MINUTES * 60 ))

      - name: Re-enable the ruleset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RULESET_ID: ${{ steps.ruleset.outputs.id }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api repos/${{ github.repository }}/rulesets/$RULESET_ID \
            -X PUT -f enforcement=active > /dev/null

          gh issue comment "$ISSUE" --repo ${{ github.repository }} --body ":lock: Bypass window expired. Ruleset \`require-endor-scan\` is active again."
          gh issue close "$ISSUE" --repo ${{ github.repository }}
